<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopAI — Đổi Mật Khẩu Tài Khoản</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { jakarta: ['"Plus Jakarta Sans"', 'system-ui'] } } }
        }
    </script>
    <style>
        * { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
        .blob { position: fixed; border-radius: 50%; filter: blur(80px); opacity: .4; pointer-events: none; z-index: 0; }
        .blob-1 { width: 450px; height: 450px; background: radial-gradient(circle, rgba(99,102,241,.12), transparent 70%); top: -5%; right: 10%; }
        .blob-2 { width: 350px; height: 350px; background: radial-gradient(circle, rgba(16,185,129,.1), transparent 70%); bottom: 5%; left: 5%; }
        @keyframes fadeUp { from { opacity:0; transform:translateY(20px) } to { opacity:1; transform:translateY(0) } }
        .anim { opacity:0; animation: fadeUp .5s cubic-bezier(.16,1,.3,1) forwards; }
    </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 min-h-screen flex flex-col justify-between">
    <div class="blob blob-1" aria-hidden="true"></div>
    <div class="blob blob-2" aria-hidden="true"></div>

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-xl border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="#" class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-600 to-indigo-400 flex items-center justify-center shadow-lg shadow-indigo-500/25">
                    <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.3 2.3c-.5.5-.1 1.3.6 1.3H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z"/></svg>
                </div>
                <span class="text-xl font-extrabold text-slate-900">Shop<span class="text-indigo-600">AI</span></span>
            </a>
            <span class="text-sm font-semibold text-slate-500">Cài Đặt Bảo Mật</span>
        </div>
    </header>

    <main class="relative z-10 max-w-lg w-full mx-auto px-6 py-10">
        <div class="anim bg-white rounded-2xl border border-slate-100 shadow-xl shadow-slate-200/50 p-8 sm:p-10">
            <div class="flex items-center gap-3 mb-6">
                <div class="w-12 h-12 rounded-2xl bg-indigo-50 border border-indigo-100 flex items-center justify-center text-indigo-600">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121 7.5z"/></svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900">Đổi Mật Khẩu Tài Khoản</h1>
                    <p class="text-xs text-slate-400">Được mã hóa an toàn bcrypt (Mật khẩu cũ test: <code class="text-indigo-600 font-bold">CurrentSecret123!</code>)</p>
                </div>
            </div>

            <form onsubmit="handleChangePassword(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Mật Khẩu Hiện Tại</label>
                    <input type="password" id="oldPassword" value="CurrentSecret123!" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Mật Khẩu Mới</label>
                    <input type="password" id="newPassword" value="BrandNewPass2026!" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Nhập Lại Mật Khẩu Mới</label>
                    <input type="password" id="confirmPassword" value="BrandNewPass2026!" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all">
                </div>

                <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-indigo-500 text-white font-bold rounded-xl shadow-lg shadow-indigo-500/25 hover:shadow-indigo-500/40 active:scale-95 transition-all mt-4">
                    Cập Nhật Mật Khẩu
                </button>
            </form>

            <div id="alertBox" class="mt-6 hidden p-4 rounded-xl text-sm font-semibold"></div>
        </div>
    </main>

    <footer class="text-center py-6 text-xs text-slate-400">
        © 2026 ShopAI Market — Bảo mật đa lớp chuẩn Enterprise
    </footer>

    <script src="change-pass-service.js"></script>
    <script>
        function handleChangePassword(e) {
            e.preventDefault();
            const oldP = document.getElementById('oldPassword').value;
            const newP = document.getElementById('newPassword').value;
            const confP = document.getElementById('confirmPassword').value;

            if (newP !== confP) {
                return showAlert('Mật khẩu mới và mật khẩu xác nhận không khớp!', 'error');
            }

            const res = changePassword('u123', oldP, newP);
            if (!res.success) {
                return showAlert(res.message, 'error');
            }

            showAlert('🎉 Đổi mật khẩu thành công! Mật khẩu mới đã được cập nhật.', 'success');
        }

        function showAlert(msg, type) {
            const el = document.getElementById('alertBox');
            el.classList.remove('hidden', 'bg-red-50', 'text-red-600', 'bg-emerald-50', 'text-emerald-600');
            if (type === 'error') {
                el.classList.add('bg-red-50', 'text-red-600');
            } else {
                el.classList.add('bg-emerald-50', 'text-emerald-600');
            }
            el.textContent = msg;
        }
    </script>
</body>
</html>
