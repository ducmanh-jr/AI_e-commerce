<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopAI — Task 6: Giao Diện Quên & Đổi Mật Khẩu (HTTMDTTHA-51)</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { jakarta: ['"Plus Jakarta Sans"', 'system-ui'] } } }
        }
    </script>
    <style>
        * { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
        .blob { position: fixed; border-radius: 50%; filter: blur(80px); opacity: .4; pointer-events: none; z-index: 0; }
        .blob-1 { width: 450px; height: 450px; background: radial-gradient(circle, rgba(99,102,241,.12), transparent 70%); top: -5%; right: 10%; }
        .blob-2 { width: 350px; height: 350px; background: radial-gradient(circle, rgba(16,185,129,.1), transparent 70%); bottom: 5%; left: 5%; }
        @keyframes fadeUp { from { opacity:0; transform:translateY(20px) } to { opacity:1; transform:translateY(0) } }
        .anim { opacity:0; animation: fadeUp .5s cubic-bezier(.16,1,.3,1) forwards; }
        .tab-btn { transition: all .25s ease; }
        .tab-btn.active { background: #4f46e5; color: white; box-shadow: 0 4px 14px rgba(79,70,229,.3); }
    </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 min-h-screen flex flex-col justify-between">
    <div class="blob blob-1" aria-hidden="true"></div>
    <div class="blob blob-2" aria-hidden="true"></div>

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-xl border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="#" class="flex items-center gap-2.5">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-600 to-indigo-400 flex items-center justify-center shadow-lg shadow-indigo-500/25">
                    <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.3 2.3c-.5.5-.1 1.3.6 1.3H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z"/></svg>
                </div>
                <span class="text-xl font-extrabold text-slate-900">Shop<span class="text-indigo-600">AI</span></span>
            </a>
            <span class="text-sm font-semibold text-slate-500">Task 6: FE Giao Diện Quên & Đổi Mật Khẩu (HTTMDTTHA-51)</span>
        </div>
    </header>

    <main class="relative z-10 max-w-xl w-full mx-auto px-6 py-10">
        <!-- Switcher Tabs -->
        <div class="bg-slate-100 p-1.5 rounded-2xl flex gap-2 mb-8 border border-slate-200">
            <button id="btnTabForgot" onclick="switchFE('forgot')" class="tab-btn active flex-1 py-3 font-bold text-sm rounded-xl text-center">
                🔑 1. Giao Diện Quên Mật Khẩu
            </button>
            <button id="btnTabChange" onclick="switchFE('change')" class="tab-btn flex-1 py-3 font-bold text-sm text-slate-500 rounded-xl text-center">
                🔒 2. Giao Diện Đổi Mật Khẩu
            </button>
        </div>

        <!-- 1. FE QUÊN MẬT KHẨU (FORGOT) -->
        <div id="boxForgot" class="anim bg-white rounded-2xl border border-slate-100 shadow-xl shadow-slate-200/50 p-8 sm:p-10">
            <h2 class="text-xl font-extrabold text-slate-900 mb-1">Cổng Quên Mật Khẩu 3 Bước</h2>
            <p class="text-sm text-slate-400 mb-6">Xác thực OTP 6 chữ số và tạo mật khẩu mới an toàn</p>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Email Tài Khoản</label>
                    <input type="email" id="forgotEmail" value="ducmanh@shopai.vn" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Mã OTP (6 Chữ Số)</label>
                    <input type="text" id="forgotOTP" maxlength="6" value="654321" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold tracking-widest text-indigo-600 focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Mật Khẩu Mới</label>
                    <input type="password" id="forgotNewPass" value="NewPass2026!" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none">
                </div>
                <button onclick="submitForgotFE()" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-500/25 active:scale-95 transition-all">
                    Xác Thực OTP & Đặt Mật Khẩu Mới
                </button>
            </div>
            <div id="alertForgot" class="mt-4 hidden p-3 rounded-xl text-xs font-bold"></div>
        </div>

        <!-- 2. FE ĐỔI MẬT KHẨU (CHANGE) -->
        <div id="boxChange" class="anim hidden bg-white rounded-2xl border border-slate-100 shadow-xl shadow-slate-200/50 p-8 sm:p-10">
            <h2 class="text-xl font-extrabold text-slate-900 mb-1">Cài Đặt Đổi Mật Khẩu</h2>
            <p class="text-sm text-slate-400 mb-6">Yêu cầu xác nhận mật khẩu hiện tại bảo vệ bởi JWT</p>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Mật Khẩu Hiện Tại</label>
                    <input type="password" id="oldPass" value="CurrentPass123!" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Mật Khẩu Mới</label>
                    <input type="password" id="newPass" value="BrandNewPass2026!" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none">
                </div>
                <button onclick="submitChangeFE()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg shadow-emerald-500/25 active:scale-95 transition-all">
                    Cập Nhật Mật Khẩu Mới
                </button>
            </div>
            <div id="alertChange" class="mt-4 hidden p-3 rounded-xl text-xs font-bold"></div>
        </div>
    </main>

    <footer class="text-center py-6 text-xs text-slate-400">
        © 2026 ShopAI Market — Task 6: Giao Diện Quên & Đổi Mật Khẩu (HTTMDTTHA-51)
    </footer>

    <script>
        function switchFE(mode) {
            const fBox = document.getElementById('boxForgot');
            const cBox = document.getElementById('boxChange');
            const fBtn = document.getElementById('btnTabForgot');
            const cBtn = document.getElementById('btnTabChange');

            if (mode === 'forgot') {
                fBox.classList.remove('hidden');
                cBox.classList.add('hidden');
                fBtn.className = 'tab-btn active flex-1 py-3 font-bold text-sm rounded-xl text-center';
                cBtn.className = 'tab-btn flex-1 py-3 font-bold text-sm text-slate-500 rounded-xl text-center';
            } else {
                fBox.classList.add('hidden');
                cBox.classList.remove('hidden');
                cBtn.className = 'tab-btn active flex-1 py-3 font-bold text-sm rounded-xl text-center';
                fBtn.className = 'tab-btn flex-1 py-3 font-bold text-sm text-slate-500 rounded-xl text-center';
            }
        }

        function submitForgotFE() {
            const email = document.getElementById('forgotEmail').value;
            const otp = document.getElementById('forgotOTP').value;
            const alert = document.getElementById('alertForgot');
            if (otp !== '654321') {
                alert.className = 'mt-4 p-3 rounded-xl text-xs font-bold bg-red-50 text-red-600';
                alert.textContent = '❌ Mã OTP không chính xác!';
            } else {
                alert.className = 'mt-4 p-3 rounded-xl text-xs font-bold bg-emerald-50 text-emerald-600';
                alert.textContent = '🎉 Đã xác thực OTP & Cập nhật mật khẩu thành công cho ' + email;
            }
            alert.classList.remove('hidden');
        }

        function submitChangeFE() {
            const oldP = document.getElementById('oldPass').value;
            const alert = document.getElementById('alertChange');
            if (!oldP) {
                alert.className = 'mt-4 p-3 rounded-xl text-xs font-bold bg-red-50 text-red-600';
                alert.textContent = '❌ Vui lòng nhập mật khẩu hiện tại!';
            } else {
                alert.className = 'mt-4 p-3 rounded-xl text-xs font-bold bg-emerald-50 text-emerald-600';
                alert.textContent = '🎉 Đổi mật khẩu tài khoản thành công!';
            }
            alert.classList.remove('hidden');
        }
    </script>
</body>
</html>
